<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eğitim — METUSAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="page-hero">
      <div class="container">
        <p class="eyebrow">Eğitim</p>
        <h1>Eğitim videoları ve kaynaklar</h1>
        <p>Takımımızın hazırladığı dersler. Yeni üyeler için başlangıç noktası, herkes için açık kaynak.</p>
      </div>
    </div>

    <section>
      <div class="container">
        <h2 class="section-title">Eğitim videoları</h2>
        <p class="section-sub">Kategoriye göre filtreleyin veya arayın.</p>
        <input id="video-search" class="search" type="search" placeholder="Videolarda ara…">
        <div id="video-filters" class="filters"></div>
        <div id="video-list"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title">Eğitim dokümanları</h2>
        <p class="section-sub">Sunumlar, ders notları ve rehberler.</p>
        <div id="training-filters" class="filters"></div>
        <div id="training-list"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/library.js"></script>
</body>
</html>
